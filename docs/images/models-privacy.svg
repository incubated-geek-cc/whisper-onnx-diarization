<svg xmlns="http://www.w3.org/2000/svg" width="680" height="252" viewBox="0 0 680 252" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Models are fetched at build time; audio never leaves the browser" xmlns:c2pa="http://c2pa.org/manifest"><title>Models are fetched at build time; audio never leaves the browser</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="252" fill="#FFFFFF"/><text x="40" y="28" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Models are fetched at build time; audio never leaves the browser</text><rect x="40" y="60" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="125.0" y="78.0" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Hugging Face</text><text x="125.0" y="98.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">public model files</text><rect x="255" y="60" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="78.0" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Render build</text><text x="340.0" y="98.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">copies models into site</text><rect x="470" y="60" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="555.0" y="78.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Visitor's browser</text><text x="555.0" y="98.0" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">models