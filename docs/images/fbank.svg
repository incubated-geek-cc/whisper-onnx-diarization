<svg xmlns="http://www.w3.org/2000/svg" width="680" height="268" viewBox="0 0 680 268" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="ResNet34 reads fbank features, which the app computes itself" xmlns:c2pa="http://c2pa.org/manifest"><title>ResNet34 reads fbank features, which the app computes itself</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="268" fill="#FFFFFF"/><text x="40" y="28" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">ResNet34 reads fbank features, which the app computes itself</text><text x="40" y="50" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Purple = the hand-written front end (kaldi-fbank.ts)</text><rect x="40" y="70" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="135.0" y="88.0" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Cut into frames</text><text x="135.0" y="108.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">25 ms, every 10 ms</text><rect x="245" y="70" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="88.0" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Clean each frame</text><text x="340.0" y="108.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">remove hum, soften edges</text><rect x="450" y="70" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="545.0" y="88.0" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Frequency power</text><text x="545.0" y="108.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">FFT, 512 points</text><rect x="40" y="186" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="135.0" y="204.0" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">80 hearing-like bands</text><text x="135.0" y="224.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Mel filters, then log</text><rect x="245" y="186" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="204.0" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Fbank grid</text><text x="340.0" y="224.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">about 1,000 x 80 numbers</text><rect x="450" y="186" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="545.0" y="204.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">ResNet34</text><text x="545.0" y="224.0" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">256-number voiceprint</text><path d="M230 98 H243" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M435 98 H448" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M545 126 V156 H135 V184" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M230 214 H243" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M435 214 H448" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>