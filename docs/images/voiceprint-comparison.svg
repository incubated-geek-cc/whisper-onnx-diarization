<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="ResNet34 makes fewer speaker errors than WavLM" xmlns:c2pa="http://c2pa.org/manifest"><title>ResNet34 makes fewer speaker errors than WavLM</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="384" fill="#FFFFFF"/><text x="40" y="28" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">ResNet34 makes fewer speaker errors than WavLM</text><text x="40" y="50" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Error rate (DER, lower is better), 1-hour test, speaker count given</text><line x1="120" y1="300" x2="640" y2="300" stroke="#B4B2A9"/><rect x="170" y="121.4" width="64" height="178.6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="202" y="109.44" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">55.8%</text><rect x="250" y="151.2" width="64" height="148.8" fill="#E1F5EE" stroke="#0F6E56"/><text x="282" y="139.2" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">46.5%</text><text x="242" y="318" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Strict scoring</text><rect x="420" y="150.2" width="64" height="149.8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="452" y="138.24" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">46.8%</text><rect x="500" y="206.2" width="64" height="93.8" fill="#E1F5EE" stroke="#0F6E56"/><text x="532" y="194.24" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">29.3%</text><text x="492" y="318" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Lenient scoring</text><rect x="120" y="350" width="12" height="12" fill="#F1EFE8" stroke="#5F5E5A"/><text x="140" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">WavLM: 102 MB, 1,066 ms per voiceprint</text><rect x="400" y="350" width="12" height="12" fill="#E1F5EE" stroke="#0F6E56"/><text x="420" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">ResNet34: 25 MB, 347 ms per voiceprint</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>