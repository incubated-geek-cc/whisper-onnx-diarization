<svg xmlns="http://www.w3.org/2000/svg" width="680" height="284" viewBox="0 0 680 284" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="How often more than 3 voices share one 10-second window" xmlns:c2pa="http://c2pa.org/manifest"><title>How often more than 3 voices share one 10-second window</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="284" fill="#FFFFFF"/><text x="40" y="28" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">How often more than 3 voices share one 10-second window</text><text x="40" y="50" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">pyannote tells apart at most 3; a 4th gets lumped in with another</text><text x="40" y="98" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Seminar, one main speaker</text><rect x="280" y="88" width="300" height="20" rx="4" fill="#F1EFE8"/><text x="280" y="122" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">rare (not measured)</text><text x="40" y="154" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">4-person meetings (AMI, 9 h)</text><rect x="280" y="144" width="300" height="20" rx="4" fill="#F1EFE8"/><rect x="280" y="144" width="34.5" height="20" rx="4" fill="#FAEEDA" stroke="#854F0B"/><text x="280" y="178" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">11.5% of windows</text><text x="40" y="210" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Boardroom, 8+ people</text><rect x="280" y="200" width="300" height="20" rx="4" fill="#F1EFE8"/><text x="280" y="234" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">likely higher (not measured)</text><text x="280" y="262" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">0%</text><text x="580" y="262" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">100% of windows</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>