<svg xmlns="http://www.w3.org/2000/svg" width="680" height="552" viewBox="0 0 680 552" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="How the app labels who said what" xmlns:c2pa="http://c2pa.org/manifest"><title>How the app labels who said what</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="552" fill="#FFFFFF"/><text x="40" y="28" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">How the app labels who said what</text><text x="40" y="50" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Everything runs in the browser; no audio leaves the device</text><rect x="240" y="70" width="200" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="86.0" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Audio or video</text><text x="340.0" y="106.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">converted with FFmpeg.wasm</text><rect x="40" y="160" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="150.0" y="176.0" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Whisper</text><text x="150.0" y="196.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">words with timestamps</text><rect x="420" y="160" width="220" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="530.0" y="176.0" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">pyannote</text><text x="530.0" y="196.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">10-s windows, up to 3 voices</text><rect x="420" y="240" width="220" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="530.0" y="256.0" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Chaining</text><text x="530.0" y="276.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">same voice = one track</text><rect x="420" y="320" width="220" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="530.0" y="336.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">ResNet34</text><text x="530.0" y="356.0" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">one voiceprint per track</text><rect x="420" y="400" width="220" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="530.0" y="416.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Grouping</text><text x="530.0" y="436.0" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">similar voiceprints = 1 speaker</text><rect x="200" y="480" width="280" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="496.0" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Merge</text><text x="340.0" y="516.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">each sentence to its speaker</text><path d="M340 122 V140 H150 V158" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M340 122 V140 H530 V158" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M530 212 V238" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M530 292 V318" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M530 372 V398" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M530 452 V506 H482" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M150 212 V506 H198" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>